name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Server and client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @repo/api-contract
      - name: Unit tests (server, vitest)
        run: npm test --workspace fs-pro-server
      - name: Typecheck the server
        run: npx tsc --noEmit
        working-directory: apps/fs-pro-server
      # BASELINE.md recorded 34 pre-existing errors (docs/perfect/vue-tsc-baseline.log).
      # The repo's own vue-tsc is broken, so run the pinned pair in a scratch
      # folder (BASELINE.md §3). continue-on-error keeps CI honest about the
      # known failures without going red; remove it once the 34 are fixed.
      - name: Typecheck the client (scratch vue-tsc@2.0.29 + typescript@5.4.5)
        continue-on-error: true
        run: |
          scratch="${RUNNER_TEMP}/vuecheck"
          mkdir -p "$scratch"
          cd "$scratch"
          npm init -y >/dev/null 2>&1
          npm install --no-save vue-tsc@2.0.29 typescript@5.4.5
          "$scratch/node_modules/.bin/vue-tsc" --noEmit -p "$GITHUB_WORKSPACE/apps/fs-pro-client/tsconfig.json"
      - name: Build the client
        run: npm run build --workspace fs-pro-client

  engine:
    name: Rust engine and Go services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: Rust tests
        run: cargo test --release
        working-directory: crates/sim-core
      - name: Build the engine CLI the sim service runs
        run: cargo build --release --bin sim-cli
        working-directory: crates/sim-core
      - name: Go tests for every module
        env:
          SIM_CORE_CLI_PATH: ${{ github.workspace }}/crates/sim-core/target/release/sim-cli
        run: |
          # Every go.mod in the repo (drop-in for new services like
          # services/world-service); .claude is the local worktree scratch dir.
          for mod in $(find . -name go.mod -not -path './node_modules/*' -not -path './.claude/*'); do
            dir=$(dirname "$mod")
            # worldgen's go:embed data/ trees are gitignored (.gitignore:29
            # 'data'), so a fresh checkout cannot build its tests. Skip with a
            # warning instead of failing the job; see docs/perfect/B1-1C-REPORT.md.
            if [ "$dir" = "./services/worldgen" ] && { [ ! -d "$dir/faces/data" ] || [ ! -d "$dir/names/data" ]; }; then
              echo "::warning title=worldgen skipped::services/worldgen embed data is gitignored and absent in a fresh checkout"
              continue
            fi
            echo "::group::go test $dir"
            (cd "$dir" && go test -count=1 ./...)
            echo "::endgroup::"
          done

  images:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          printf 'PUBLIC_HOST=x.example\nPOSTGRES_USER=u\nPOSTGRES_PASSWORD=p\nPOSTGRES_DB=d\nSESSION_SECRET=s\nREALTIME_SECRET=r\nDATABASE_URL=postgresql://u:p@h/d\n' > ci.env
          docker compose -f compose.prod.yaml --env-file ci.env config -q
          docker compose -f compose.dokploy.yaml --env-file ci.env config -q
      - name: Build the images
        run: docker compose -f compose.prod.yaml --env-file ci.env build
