<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advisor mockup - Vintra on the campus</title>
<style>
  /* A low-fidelity mockup: the real campus screenshot (HUD, dock and PLAY are
     baked in) with the advisor laid over it at the breakpoint's docking rule.
     It exists to check the one rule the spec must never break (L10): the
     advisor must not cover PLAY, the dock or the resource HUD. */
  html, body { margin: 0; padding: 0; }
  .stage { position: relative; overflow: hidden; background: #6dbb47; }
  body.desktop .stage { width: 1440px; height: 900px; background-image: url('campus-desktop.png'); }
  body.mobile  .stage { width: 390px;  height: 844px; background-image: url('campus-mobile.png'); }
  .stage { background-size: cover; background-position: top left; }

  /* ---- The advisor dock (L10) -------------------------------------------- */
  .advisor {
    position: absolute; z-index: 6;
    display: flex; align-items: flex-end; gap: 6px;
    filter: drop-shadow(0 6px 6px rgba(40,25,10,.25));
  }
  /* Desktop: bottom-left, stacked above the 96px World button *and* the
     community presence pill (cozy-presence.vue: bottom:120px). */
  body.desktop .advisor { left: 10px; bottom: 166px; }
  /* Mobile: bottom-left, sitting just above the date bar (worldbtn hidden,
     presence pill moves to the top-left at cozy-presence.vue: top:252px). */
  body.mobile  .advisor { left: 8px;  bottom: 136px; }

  .advisor img.portrait { display: block; }
  /* A cream portrait plaque keeps the mist-green kit legible on the grass. */
  body.desktop .advisor img.portrait {
    width: 116px; height: 130px; background: radial-gradient(circle at 50% 32%, #fff8e6, #efdcb2);
    border: 3px solid #c9a46a; border-radius: 18px;
  }
  body.mobile .advisor img.portrait {
    width: 84px; height: 94px; background: radial-gradient(circle at 50% 32%, #fff8e6, #efdcb2);
    border: 3px solid #c9a46a; border-radius: 15px;
  }

  /* ---- Speech bubble ------------------------------------------------------ */
  .bubble {
    position: relative; align-self: flex-end;
    margin-bottom: 10px;
    background: #fdf4df; border: 3px solid #c9a46a; border-radius: 16px;
    box-shadow: 0 4px 0 rgba(70,40,15,.35);
    padding: 10px 30px 10px 12px;
    font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; color: #4a3220;
  }
  body.desktop .bubble { width: 330px; }
  body.mobile  .bubble { width: 246px; padding: 9px 26px 9px 11px; }
  .bubble::after {
    content: ''; position: absolute; left: -14px; bottom: 16px;
    border: 9px solid transparent; border-right-color: #fdf4df; border-left: 0;
    filter: drop-shadow(-2px 1px 0 #c9a46a);
  }
  .bubble .who { font-weight: 700; font-size: 13px; color: #8a5a3b; margin-bottom: 2px; }
  .bubble .line { font-size: 15px; line-height: 1.32; }
  body.mobile .bubble .line { font-size: 14px; }
  .bubble .cue { margin-top: 6px; font-size: 12px; color: #6f5940; }
  .bubble .cue kbd {
    font: inherit; background: #fffaf0; border: 2px solid #e2cc9c; border-radius: 6px;
    padding: 0 5px;
  }
  .bubble .mute {
    position: absolute; top: 4px; right: 6px; border: 0; background: none;
    color: #6f5940; font-size: 15px; cursor: pointer;
  }
  /* ---- A world-space point marker (drawn where campus scene projects it) -- */
  .marker { position: absolute; width: 54px; height: 54px; margin: -27px; z-index: 5; }
  .marker::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 4px solid #f5b82e; box-shadow: 0 0 0 4px rgba(245,184,46,.35);
  }
  .marker::after {
    content: '▾'; position: absolute; left: 50%; top: -30px; transform: translateX(-50%);
    font-size: 30px; color: #f5b82e; -webkit-text-stroke: 1px #8a5a3b;
  }
  /* Dotted sight-line from the advisor's pointer to the marker. */
  .sight { position: absolute; z-index: 4; height: 3px; background: repeating-linear-gradient(90deg, rgba(94,59,34,.6) 0 10px, transparent 10px 18px); transform-origin: 0 0; }
</style>
</head>
<body>
  <div class="stage">
    <!-- Pointing at the empty manager's office: marker + sight-line are drawn
         by the campus scene (projected world position), not by this mockup. -->
    <div class="sight" id="sight"></div>
    <div class="marker" id="marker"></div>

    <div class="advisor">
      <img class="portrait" id="portrait" src="advisor-happy.svg" alt="" aria-hidden="true" />
      <div class="bubble" role="status" aria-live="polite">
        <button class="mute" title="Quiet the advisor" aria-label="Quiet the advisor">✕</button>
        <div class="who">Vintra</div>
        <div class="line" id="line">Right then. Your manager keeps things ticking - but a bench of strangers won't win you a league. Shall we shop?</div>
        <div class="cue"><b id="caret">▌</b> Tap the bubble or press <kbd>Enter</kbd> to carry on</div>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const size = params.get('size') === 'mobile' ? 'mobile' : 'desktop';
  document.body.className = size;
  // Which expression / line the mockup should show. e.g. ?expr=thinking&point=off
  const expr = params.get('expr');
  if (expr) document.getElementById('portrait').src = `advisor-${expr}.svg`;
  if (params.get('point') === 'on') {
    // A representative projected marker: the empty manager's office pad.
    const rect = { x: size === 'mobile' ? 250 : 720, y: size === 'mobile' ? 430 : 300 };
    const m = document.getElementById('marker');
    m.style.left = rect.x + 'px'; m.style.top = rect.y + 'px';
    const a = document.querySelector('.advisor').getBoundingClientRect();
    const s = document.getElementById('sight');
    const ox = a.left + (size === 'mobile' ? 66 : 96), oy = a.top + (size === 'mobile' ? 20 : 26);
    const dx = rect.x - ox, dy = rect.y - oy;
    s.style.left = ox + 'px'; s.style.top = oy + 'px';
    s.style.width = Math.hypot(dx, dy) + 'px';
    s.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  } else {
    document.getElementById('marker').style.display = 'none';
  }
</script>
</body>
</html>
