[package]
name = "sim-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "sim_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "sim-cli"
path = "src/bin/sim_cli.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_xoshiro = "0.6"

[[bin]]
name = "sim-lab"
path = "src/bin/sim_lab.rs"
