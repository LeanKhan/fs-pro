services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: fspro
      POSTGRES_PASSWORD: superpassword
      POSTGRES_DB: fspro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fspro -d fspro"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: